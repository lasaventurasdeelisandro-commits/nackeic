    <title>NAKEIC - Conecta Sin Límites</title>
    <meta name="description" content="NAKEIC - Conecta Sin Límites. Aplicación móvil nativa para Android de mensajería privada, llamadas WebRTC, estados temporales, cifrado y personalización de temas." />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[NAKEIC] Service Worker registered:', reg.scope);
          }).catch(function(err) {
            console.log('[NAKEIC] Service Worker registration failed:', err);
          });
        });
      }
    </script>
