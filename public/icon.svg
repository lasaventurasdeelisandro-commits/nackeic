<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radar Rings in background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Glowing Radar Dot -->
  <circle cx="360" cy="160" r="10" fill="url(#cyan)" filter="url(#glow)"/>

  <!-- Big Bold Directo "D" with stylized shape -->
  <path d="M 148 116 L 260 116 C 342 116 398 168 398 256 C 398 344 342 396 260 396 L 148 396 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M 216 186 L 254 186 C 300 186 330 216 330 256 C 330 296 300 326 254 326 L 216 326 Z" fill="#0f172a"/>

  <!-- Lightning Bolt cutout / overlay inside D -->
  <polygon points="266,198 232,260 262,260 242,314 286,246 256,246" fill="url(#gold)"/>
</svg>
